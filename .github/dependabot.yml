version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      patch-minor:
        update-types: [patch, minor]
        patterns: ["*"]
      major:
        update-types: [major]
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend/requirements
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      patch-minor:
        update-types: [patch, minor]
        patterns: ["*"]
      major:
        update-types: [major]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 3
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      all:
        patterns: ["*"]