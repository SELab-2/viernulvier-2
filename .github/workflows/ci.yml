name: Backend CI

on:
  push:
    branches: [main, dev, backend]
    paths:
      - "backend/**"
  pull_request:
    branches: [main, dev, backend]
    paths:
      - "backend/**"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Ruff auto-fix
    runs-on: self-hosted
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Ruff auto-fix
        run: |
          ruff check . --fix
          ruff format .

      - name: Commit fixes (skip if nothing changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git diff --quiet && exit 0

          git add -A
          git commit -m "chore: ruff auto-fix"
          git push

  lint:
    name: Ruff lint check
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Django check + Pytest
    runs-on: self-hosted
    needs: [autofix, lint]
    if: |
      always() &&
      (needs.autofix.result == 'success' || needs.autofix.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: django-insecure-test-key-only-for-github-actions
      INTERNAL_API_KEY: test-internal-key
      PUBLIC_API_KEY: test-public-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: pytest -q --cov=. --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/htmlcov
