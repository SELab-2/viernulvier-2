name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - name: Validate deployment secrets
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VIERNULVIER_API_KEY: ${{ secrets.VIERNULVIER_API_KEY }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          : "${SECRET_KEY:?Missing SECRET_KEY}"
          : "${DOMAIN:?Missing DOMAIN}"
          : "${POSTGRES_DB:?Missing POSTGRES_DB}"
          : "${POSTGRES_USER:?Missing POSTGRES_USER}"
          : "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}"
          : "${VIERNULVIER_API_KEY:?Missing VIERNULVIER_API_KEY}"
          : "${PUBLIC_API_KEY:?Missing PUBLIC_API_KEY}"
          : "${INTERNAL_API_KEY:?Missing INTERNAL_API_KEY}"

      - name: Build and start containers
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VIERNULVIER_API_KEY: ${{ secrets.VIERNULVIER_API_KEY }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          docker compose -f infrastructure/docker-compose.prod.yml build
          docker compose -f infrastructure/docker-compose.prod.yml up -d

      - name: Verify deployment
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VIERNULVIER_API_KEY: ${{ secrets.VIERNULVIER_API_KEY }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          sleep 5
          docker compose -f infrastructure/docker-compose.prod.yml ps
